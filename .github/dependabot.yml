# Keeps dependencies up to date with weekly pull requests. CI runs on each
# one, so a green check means the update is safe to merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /ai-flashcard-generator
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Small updates arrive together in one pull request; major versions
      # (which can break things) each get their own.
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
