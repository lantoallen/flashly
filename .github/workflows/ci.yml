name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an older run when new commits arrive on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: ai-flashcard-generator

jobs:
  checks:
    name: Lint, test, build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ai-flashcard-generator/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `next typegen` first: the global route types (LayoutProps, RouteContext)
      # are generated files that a fresh checkout doesn't have yet.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit and database tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            ai-flashcard-generator/playwright-report
            ai-flashcard-generator/test-results
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Fail on high or critical advisories in production dependencies
        run: npm audit --omit=dev --audit-level=high
